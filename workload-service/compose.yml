services:
  mongodb:
    image: mongo:7
    container_name: ali-gymcrm-mongodb
    env_file:
      - .env
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${DOCKER_MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${DOCKER_MONGO_PASSWORD}
      - MONGO_INITDB_DATABASE=${DOCKER_MONGO_DB}
    ports:
      - "${DOCKER_MONGO_PORT}:27017"
    volumes:
      - ali-gymcrm_mongodb:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--username", "${DOCKER_MONGO_USER}", "--password", "${DOCKER_MONGO_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - gymcrm-network

  workload-app:
    image: eclipse-temurin:17-jre
    container_name: ali-gymcrm-workload
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    environment:
        - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "${WORKLOAD_SERVICE_PORT}:${WORKLOAD_SERVICE_PORT}"
    volumes:
      - ./target/workload-service.jar:/app/workload-service.jar
    command: [ "java", "-jar", "/app/workload-service.jar" ]
    networks:
      - gymcrm-network

networks:
  gymcrm-network:
    external: true

volumes:
  ali-gymcrm_mongodb: