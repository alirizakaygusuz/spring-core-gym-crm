services:
  mongodb:
    image: mongo:7
    container_name: ali-gymcrm-mongodb
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DOCKER_MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DOCKER_MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${DOCKER_MONGO_DB}
    ports:
      - "${DOCKER_MONGO_PORT}:27017"
    volumes:
      - ali-gymcrm_mongodb:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--username", "admin", "--password", "admin", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - gymcrm-network

  workload-app:
    build:
        context: .
        dockerfile: Dockerfile
    image: ali-gymcrm-workload:latest
    container_name: ali-gymcrm-workload
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DOCKER_MONGO_HOST: ${DOCKER_MONGO_HOST}
      DOCKER_MONGO_USER: ${DOCKER_MONGO_USER}
      DOCKER_MONGO_PASSWORD: ${DOCKER_MONGO_PASSWORD}
      DOCKER_MONGO_DB: ${DOCKER_MONGO_DB}
      JWT_SECRET: ${JWT_SECRET}
      WORKLOAD_SERVICE_PORT: ${WORKLOAD_SERVICE_PORT}
      DOCKER_ARTEMIS_BROKER_URL: ${DOCKER_ARTEMIS_BROKER_URL}
      DOCKER_ARTEMIS_USER: ${DOCKER_ARTEMIS_USER}
      DOCKER_ARTEMIS_PASSWORD: ${DOCKER_ARTEMIS_PASSWORD}
    ports:
      - "${WORKLOAD_SERVICE_PORT}:${WORKLOAD_SERVICE_PORT}"
    networks:
      - gymcrm-network

networks:
  gymcrm-network:
    driver: bridge
    name: gymcrm-network

volumes:
  ali-gymcrm_mongodb: