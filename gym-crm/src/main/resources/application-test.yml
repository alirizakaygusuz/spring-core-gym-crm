spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

security:
  jwt:
    secret: "test-secret-key-that-is-at-least-32-characters-long-for-hmac"
    expiration: 3600000
  rate-limit:
    login:
      max-attempts: 3
      block-duration: 5m
      redis-key-prefix: "rate-limit:login:"
  blacklist:
    redis-key-prefix: "token:blacklist:"
    enabled: true