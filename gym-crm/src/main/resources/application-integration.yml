spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      host: localhost
      port: ${DOCKER_REDIS_PORT}
  artemis:
    broker-url: tcp://localhost:${DOCKER_ARTEMIS_PORT}
    user: ${DOCKER_ARTEMIS_USER}
    password: ${DOCKER_ARTEMIS_PASSWORD}

workload-service:
  base-url: ${WORKLOAD_SERVICE_URL}