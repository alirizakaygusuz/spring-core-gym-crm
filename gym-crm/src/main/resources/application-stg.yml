spring:
  datasource:
    url: jdbc:postgresql://${STG_DB_HOST}:${STG_DB_PORT}/${STG_DB_NAME}
    username: ${STG_DB_USER}
    password: ${STG_DB_PASSWORD}

  artemis:
    broker-url: ${STG_ARTEMIS_BROKER_URL}
    user: ${STG_ARTEMIS_USER}
    password: ${STG_ARTEMIS_PASSWORD}

logging:
  level:
    com.alirizakaygusuz.gymcrm: INFO
    org.springframework.web: WARN